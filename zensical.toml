[project]
site_name = "Genomic Knowledge Model Starter Kit"
site_description = "Tools and examples for the GA4GH Genomic Knowledge Model"
site_url = "https://ga4gh.github.io/gkm-starter-kit/"
repo_url = "https://github.com/ga4gh/gkm-starter-kit"
repo_name = "ga4gh/gkm-starter-kit"
edit_uri = "edit/main/docs/"
docs_dir = "docs-build"
extra_css = ["assets/css/extra.css"]
extra_javascript = ["assets/js/external-links.js"]
strict = true
nav = [
  { Home = "index.md" },
  { "About the GKM" = "about.md" },
  { Data = [
    "data/index.md",
    { Bundles = [
      "data/bundles/index.md",
      { "Bundle schemas and contents" = "data/bundles/schemas-and-contents.md" },
      { "Mini examples" = "data/bundles/mini-examples.md" },
      { "Public repository" = "data/bundles/repository.md" },
    ] },
  ] },
  { Toolkit = [
    "toolkit/installation.md",
    "toolkit/index.md",
    { "API reference" = [
      "toolkit/api/index.md",
      { Containers = "toolkit/api/containers.md" },
      { Loading = "toolkit/api/loading.md" },
      { Pointers = "toolkit/api/pointers.md" },
      { "Schema resolution" = "toolkit/api/schema-resolution.md" },
      { "Model conversion" = "toolkit/api/model-conversion.md" },
      { Compatibility = "toolkit/api/compatibility.md" },
      { Registry = "toolkit/api/registry.md" },
      { "Bundle repository" = "toolkit/api/repository.md" },
      { Errors = "toolkit/api/errors.md" },
    ] },
    { "Explore with notebooks" = [
      "toolkit/notebooks/index.md",
      { "Explore mini bundle examples" = "toolkit/notebooks/civic-notebook.md" },
      { "Public repository bundle walkthrough" = "toolkit/notebooks/repository-notebook.md" },
    ] },
    { "Development and contributing" = "development.md" },
  ] },
  { "User Stories" = [
    "user-stories/index.md",
    { "Browse by product" = [
      { VRS = "user-stories/by-product/vrs/index.md" },
    ] },
    { "Browse by use pattern" = [
      { "Cross-source variant harmonization" = "user-stories/by-pattern/cross-source-variant-harmonization/index.md" },
    ] },
    { "Browse by implementer" = [
      { "BRCA Exchange" = "user-stories/by-implementer/brca-exchange/index.md" },
    ] },
    { "Contribute to User Stories" = "user-stories/contribute.md" },
  ] },
]

[project.extra.version]
provider = "mike"
default = "latest"

[project.theme]
variant = "classic"
logo = "assets/images/ga4gh-favicon.svg"
favicon = "assets/images/ga4gh-favicon.svg"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "toc.follow",
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "search.suggest",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
options.docstring_style = "sphinx"
options.filters = ["!^_[^_]"]
options.inherited_members = false
options.merge_init_into_class = true
options.members_order = "source"
options.separate_signature = true
options.show_signature_annotations = true
options.show_source = false
options.show_symbol_type_heading = true
options.show_symbol_type_toc = true
options.signature_crossrefs = true

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
tables = {}
pymdownx.inlinehilite = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.tabbed.alternate_style = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
