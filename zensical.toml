[project]
site_name = "Genomic Knowledge Model Starter Kit"
site_description = "Tools and examples for the GA4GH Genomic Knowledge Model"
site_url = "https://ga4gh.github.io/gkm-starter-kit/"
repo_url = "https://github.com/ga4gh/gkm-starter-kit"
repo_name = "ga4gh/gkm-starter-kit"
edit_uri = "edit/main/docs/"
docs_dir = "docs-build"
extra_css = ["assets/css/extra.css"]
extra_javascript = ["assets/js/external-links.js"]
strict = true
nav = [
  { Home = "index.md" },
  { Data = [
    "data/index.md",
    { "Contribute to Data" = "data/contributing.md" },
    { Bundles = [
      "data/bundles/index.md",
      { "Bundle schemas and contents" = "data/bundles/schemas-and-contents.md" },
      { "Mini bundle examples" = "data/bundles/mini-examples.md" },
      { "Explore published bundles" = "data/bundles/repository.md" },
    ] },
  ] },
  { Tools = [
    "tools/index.md",
    { "Reference implementations" = "tools/reference-implementations.md" },
    { "GKM Toolkit" = [
      "tools/gkm-toolkit/index.md",
      "tools/gkm-toolkit/installation.md",
      { "Getting started" = "tools/gkm-toolkit/getting-started.md" },
      { "Explore with notebooks" = [
        "tools/gkm-toolkit/notebooks/index.md",
        { "Explore mini bundles" = "tools/gkm-toolkit/notebooks/civic-notebook.md" },
        { "Explore the public bundle repository" = "tools/gkm-toolkit/notebooks/repository-notebook.md" },
      ] },
      { "API reference" = [
        "tools/gkm-toolkit/api/index.md",
        { Containers = "tools/gkm-toolkit/api/containers.md" },
        { Loading = "tools/gkm-toolkit/api/loading.md" },
        { Pointers = "tools/gkm-toolkit/api/pointers.md" },
        { "Schema validation" = "tools/gkm-toolkit/api/schema-validation.md" },
        { "Schema resolution" = "tools/gkm-toolkit/api/schema-resolution.md" },
        { "Model conversion" = "tools/gkm-toolkit/api/model-conversion.md" },
        { Compatibility = "tools/gkm-toolkit/api/compatibility.md" },
        { Registry = "tools/gkm-toolkit/api/registry.md" },
        { "Bundle repository" = "tools/gkm-toolkit/api/repository.md" },
        { Errors = "tools/gkm-toolkit/api/errors.md" },
      ] },
      { "Development and contributing" = "tools/gkm-toolkit/development.md" },
    ] },
  ] },
  { "User Stories" = [
    "user-stories/index.md",
    { "Browse by product" = [
      "user-stories/by-product/index.md",
      { GKS-Core = "user-stories/by-product/gks-core/index.md" },
      { VRS = "user-stories/by-product/vrs/index.md" },
      { Cat-VRS = "user-stories/by-product/cat-vrs/index.md" },
      { VA-Spec = "user-stories/by-product/va-spec/index.md" },
    ] },
    { "Browse by use pattern" = [
      "user-stories/by-pattern/index.md",
      { "Cross-source variant harmonization" = "user-stories/by-pattern/cross-source-variant-harmonization/index.md" },
      { "Knowledgebase exchange" = "user-stories/by-pattern/knowledgebase-exchange/index.md"}
    ] },
    { "Browse by implementer" = [
      "user-stories/by-implementer/index.md",
      { "BRCA Exchange" = [
        "user-stories/by-implementer/brca-exchange/index.md",
        { "Identifying unique variants across sources with VRS" = "user-stories/brca/identifying-unique-variants-vrs/vignette.md" },
      ] },
      { "CIViC" = [
        "user-stories/by-implementer/civic/index.md",
        { "Sharing oncogenicity knowledge with GA4GH GKM" = [
          "user-stories/civic/civic-oncogenicity-gkm/vignette/index.md",
          { "Try the Notebook" = "user-stories/civic/civic-oncogenicity-gkm/notebook.md" },
        ] },
      ] }
    ] },
    { "Contribute to User Stories" = "user-stories/contribute.md" },
  ] },
  { "About the GKM" = "about.md" },
]

[project.extra.version]
provider = "mike"
default = "latest"

[project.theme]
variant = "classic"
logo = "assets/images/ga4gh-favicon.svg"
favicon = "assets/images/ga4gh-favicon.svg"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "toc.follow",
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "search.suggest",
  "search.highlight",
]

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
options.docstring_style = "sphinx"
options.filters = ["!^_[^_]"]
options.inherited_members = false
options.merge_init_into_class = true
options.members_order = "source"
options.separate_signature = true
options.show_signature_annotations = true
options.show_source = false
options.show_symbol_type_heading = true
options.show_symbol_type_toc = true
options.signature_crossrefs = true

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
tables = {}
pymdownx.inlinehilite = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.tabbed.alternate_style = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
