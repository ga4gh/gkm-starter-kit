site_name: GKS Starter Kit
site_description: Real-world walk-throughs of high-value uses of the GA4GH Genomic Knowledge Standards
site_url: https://ga4gh.github.io/gks-starter-kit/  # Update once canonical URL is decided
repo_url: https://github.com/ga4gh/gks-starter-kit  # Update once repo is on GitHub
repo_name: ga4gh/gks-starter-kit
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.action.edit
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

extra_css:
  - assets/css/extra.css

plugins:
  - search
  - macros:
      module_name: scripts
  - gen-files:
      scripts:
        - scripts/gen_filter_pages.py
        - scripts/gen_schema_pages.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

exclude_docs: |
  superpowers/
  vignettes/_template/
  vignettes/patterns.yml

nav:
  - Home: index.md
  - Data Bundles:
      - data/index.md
      - Bundle schema: data/schemas/gks-bundle.md
  - Python Package:
      - library/index.md
  - Vignettes:
      - vignettes/index.md
  - Contribute: contribute.md
  - About: about.md

strict: true
