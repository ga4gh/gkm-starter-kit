[project]
name = "gkm.starter"
authors = [{ name = "GKM Contributors" }]
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
description = "Genomic Knowledge Model Starter Kit"
license = "CC0-1.0"
license-files = ["LICENSE"]
dependencies = [
  "ga4gh.va_spec @ git+https://github.com/ga4gh/va-spec-python.git@daa80e6e858da367126aea6ca96c604a06cf0661",
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.5.49",
  "mkdocs-macros-plugin==1.3.7",
  "mkdocs-gen-files==0.5.0",
  "json-schema-for-humans==1.5.1",
  "PyYAML==6.0.2",
  "mkdocstrings[python]"
]
tests = ["pytest", "pytest-cov"]
dev = ["prek>=0.2.23", "ruff==0.14.10"]
notebooks = ["ipykernel"]


[project.urls]
Homepage = "https://github.com/ga4gh/gks-starter-kit"
Documentation = "https://github.com/ga4gh/gks-starter-kit"
Changelog = "https://github.com/ga4gh/gks-starter-kit/releases"
Source = "https://github.com/ga4gh/gks-starter-kit"
"Bug Tracker" = "https://github.com/ga4gh/gks-starter-kit/issues"

[project.scripts]

[build-system]
requires = ["setuptools>=77.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # unused
  "AIR",
  "ERA",
  "YTT",
  "BLE",
  "FBT",
  "CPY",
  "DJ",
  "EXE",
  "FIX",
  "FA",
  "PYI",
  "TD",
  "C90",
  "NPY",
  "PD",
  # ignore for compatibility with formatter
  "D206",
  "D300",
  "W191",
  "E111",
  "E114",
  "E117",
  "E501",
  "W191",
  "S321",
  "COM812",
  "COM819",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  # don't require types on *args, **kwargs
  "ANN002",
  "ANN003",
  # subjective pylint thresholds
  "PLR0904",
  "PLR091",
  "PLR1702",
  "PLC0206",
  # misc unnecessary stuff
  "S321",
  "D203",
  "D205",
  "D213",
  "D400",
  "D415",
]

[tool.ruff.lint.per-file-ignores]
# ANN001 - missing-type-function-argument
# ANN2 - missing-return-type
# D100 - undocumented-public-module
# D102 - undocumented-public-class
# D103 - undocumented-public-function
# S101 - assert
# B011 - assert-false
# INP001 - implicit-namespace-package
# PLR2004 - magic-value-comparison
"tests/*" = ["ANN001", "ANN2", "D", "S101", "B011", "INP001", "PLR2004"]
"notebooks/*.ipynb" = ["T201", "S101"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.format]
docstring-code-format = true
